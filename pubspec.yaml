name: snakes_ladders
description: "Snakes & Ladders - a premium animated board game for Android, iOS and Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_database: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
